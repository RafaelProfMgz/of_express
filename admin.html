<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Painel da administradora — OF</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:1rem}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:.8rem;padding:.85rem;box-shadow:var(--shadow)}
  .kpi strong{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.1}
  .kpi span{font-size:.75rem;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
  .abas{display:flex;gap:.35rem;margin-bottom:1rem;overflow-x:auto;padding-bottom:.2rem}
  .abas button{flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:2rem;padding:.4rem .8rem;font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--text)}
  .abas button.on{background:var(--dark);border-color:var(--dark);color:#fff}
  .item{background:#fff;border:1px solid var(--line);border-radius:.8rem;padding:.9rem;margin-bottom:.6rem;box-shadow:var(--shadow);font-size:.88rem}
  .item h3{font-size:.98rem;margin-bottom:.2rem}
  .item .meta{font-size:.78rem;color:var(--sub)}
</style>
</head>
<body data-pagina="admin">

<div id="of-header"></div>

<main class="wrap">
  <div class="page-head">
    <h1>Painel da administradora</h1>
    <p id="sub-painel">Tudo que está guardado neste navegador.</p>
  </div>

  <section id="sem-acesso" class="hidden">
    <div class="card">
      <h2>Acesso restrito</h2>
      <p class="sub">Esta página é só para a administradora do grupo.</p>
      <a href="login.html" class="btn">Entrar como admin</a>
      <a href="index.html" class="btn btn-outline">Voltar para a home</a>
    </div>
  </section>

  <section id="painel" class="hidden">
    <div class="kpis" id="kpis"></div>
    <div class="abas" id="abas" role="tablist"></div>
    <div id="conteudo-aba"></div>
  </section>
</main>

<div id="of-footer"></div>

<script src="assets/app.js"></script>
<script>
document.addEventListener('of:pronto', function () {
  if (!OF.ehAdmin()) {
    document.getElementById('sem-acesso').classList.remove('hidden');
    return;
  }
  document.getElementById('painel').classList.remove('hidden');

  var abas = [
    { id: 'diarias', nome: 'Diárias' },
    { id: 'contatos', nome: 'Contatos recebidos' },
    { id: 'comentarios', nome: 'Comentários' },
    { id: 'usuarios', nome: 'Usuários' },
    { id: 'pagamentos', nome: 'Pagamentos' }
  ];
  var atual = 'diarias';

  function kpis() {
    var d = OF.diarias(), c = OF.contatos(), u = OF.users(), p = OF.pagamentos();
    var receita = p.reduce(function (s, x) { return s + (Number(x.valor) || 0); }, 0);
    var cm = OF.comentarios();
    var media = cm.length ? OF.mediaNotas().toFixed(1).replace('.', ',') : '—';
    document.getElementById('kpis').innerHTML =
      '<div class="kpi"><strong>' + d.length + '</strong><span>Diárias no ar</span></div>' +
      '<div class="kpi"><strong>' + c.length + '</strong><span>Contatos recebidos</span></div>' +
      '<div class="kpi"><strong>' + u.length + '</strong><span>Contas criadas</span></div>' +
      '<div class="kpi"><strong>' + OF.brl(receita) + '</strong><span>Taxas (simuladas)</span></div>' +
      '<div class="kpi"><strong>' + cm.length + '</strong><span>Comentários</span></div>' +
      '<div class="kpi"><strong>' + media + '</strong><span>Nota média</span></div>';
  }

  function pintarAbas() {
    document.getElementById('abas').innerHTML = abas.map(function (a) {
      return '<button type="button" role="tab" data-aba="' + a.id + '" class="' + (a.id === atual ? 'on' : '') + '">' + a.nome + '</button>';
    }).join('');
    document.querySelectorAll('[data-aba]').forEach(function (b) {
      b.addEventListener('click', function () { atual = b.dataset.aba; pintarAbas(); pintarConteudo(); });
    });
  }

  function pintarConteudo() {
    var alvo = document.getElementById('conteudo-aba');

    if (atual === 'diarias') {
      var d = OF.diarias();
      alvo.innerHTML = d.length ? d.map(function (x) {
        return '<div class="item">' +
          '<h3>' + OF.esc(x.titulo || x.desc) + '</h3>' +
          '<div class="meta">' + OF.esc(x.nome) + ' · ' + OF.esc(x.tel) + ' · ' + OF.esc(x.local) + '</div>' +
          '<div class="meta">' + OF.brl(x.valor) + ' · taxa ' + OF.brl(OF.taxa(x.valor)) + ' · ' + OF.esc(OF.labelTipo(x.tipo)) +
            (x.autor ? ' · por @' + OF.esc(x.autor) : '') + '</div>' +
          '<div class="acoes" style="display:flex;gap:.5rem;margin-top:.6rem">' +
            '<a href="detalhes-diaria.html?id=' + encodeURIComponent(x.id) + '" class="btn-small">Ver</a>' +
            '<button type="button" class="btn-ghost-small" data-del="' + OF.esc(x.id) + '">Excluir</button>' +
          '</div></div>';
      }).join('') : '<div class="empty">Nenhuma diária publicada.</div>';
      alvo.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('Excluir esta diária definitivamente?')) return;
          OF.removerDiaria(b.dataset.del);
          kpis(); pintarConteudo();
        });
      });

    } else if (atual === 'contatos') {
      var c = OF.contatos();
      alvo.innerHTML = c.length ? c.map(function (x) {
        return '<div class="item">' +
          '<h3>' + OF.esc(x.nome) + ' — ' + OF.esc(x.tel) + '</h3>' +
          '<div class="meta">Diária: ' + OF.esc(x.diariaTitulo || x.diariaId) + ' · ' + OF.esc(OF.dataBR(x.quando)) + '</div>' +
          (x.experiencia ? '<div class="meta">Experiência: ' + OF.esc(x.experiencia) + '</div>' : '') +
          (x.mensagem ? '<p style="margin-top:.4rem;color:var(--sub)">' + OF.esc(x.mensagem) + '</p>' : '') +
          '</div>';
      }).join('') : '<div class="empty">Nenhum contato registrado ainda.</div>';

    } else if (atual === 'comentarios') {
      var cm = OF.comentarios();
      alvo.innerHTML = cm.length
        ? cm.map(function (x) { return OF.cardComentario(x, { podeExcluir: true, mostrarAutor: true }); }).join('')
        : '<div class="empty">Nenhum comentário publicado.</div>';
      alvo.querySelectorAll('[data-excluir-coment]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('Excluir este comentário definitivamente?')) return;
          OF.removerComentario(b.dataset.excluirComent);
          kpis(); pintarConteudo();
        });
      });

    } else if (atual === 'usuarios') {
      var u = OF.users();
      alvo.innerHTML = u.length ? u.map(function (x) {
        return '<div class="item">' +
          '<h3>' + OF.esc(x.nome || x.user) + ' <span class="tag">@' + OF.esc(x.user) + '</span></h3>' +
          '<div class="meta">' + OF.esc(x.email || '—') + ' · ' + OF.esc(x.tel || '—') + '</div>' +
          '<div class="meta">' + OF.esc(OF.LABEL_TIPO[x.tipo] || x.tipo) + ' · criada em ' + OF.esc(OF.dataBR(x.criado)) + '</div>' +
          '</div>';
      }).join('') : '<div class="empty">Nenhuma conta criada.</div>';

    } else {
      var p = OF.pagamentos();
      alvo.innerHTML = p.length ? p.map(function (x) {
        return '<div class="item">' +
          '<h3>' + OF.brl(x.valor) + ' · ' + OF.esc(x.metodoLabel) + '</h3>' +
          '<div class="meta">' + OF.esc(x.transacao) + ' · autorização ' + OF.esc(x.autorizacao) + '</div>' +
          '<div class="meta">' + OF.esc(OF.dataBR(x.quando)) + ' · <span class="tag">SIMULADO</span></div>' +
          '</div>';
      }).join('') : '<div class="empty">Nenhum pagamento simulado ainda.</div>';
    }
  }

  kpis(); pintarAbas(); pintarConteudo();
});
</script>
</body>
</html>
