<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Cadastrar diária — OF</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap');
  :root{--bg:#f6f5f0;--card:#fff;--accent:#d97706;--text:#2a2a2a;--sub:#6b6b6b;--line:#ebeae5;--dark:#2a2a2a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:16px;}
  a{color:var(--accent);text-decoration:none}
  .wrap{width:min(480px,95vw);margin-inline:auto;padding:1rem 1rem 3rem}
  header.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1rem}
  .header-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .logo-block{display:flex;align-items:center;gap:.6rem}
  .logo-sigla{width:36px;height:36px;border-radius:.5rem;background:var(--dark);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.1rem;flex-shrink:0}
  .logo-text{font-weight:700;font-size:.85rem;line-height:1.15;color:var(--text)}
  .nav-center{display:flex;gap:.85rem;font-weight:600;font-size:.85rem}
  .nav-right{position:relative}
  .btn-small{background:var(--accent);color:#fff;padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;border:none;cursor:pointer}
  .btn-ghost-small{background:transparent;border:1px solid #ddd;color:var(--text);padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;cursor:pointer}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;margin:1rem 0 .5rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.03)}
  label{font-weight:600;font-size:.82rem;display:block;margin:.8rem 0 .25rem}
  input,select,textarea{width:100%;padding:.7rem .8rem;border:1px solid #ddd;border-radius:.6rem;font-family:inherit;font-size:.95rem}
  textarea{resize:vertical;min-height:80px}
  .btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;padding:.9rem;border-radius:.7rem;font-weight:700;font-size:1rem;border:none;margin-top:.5rem;cursor:pointer;box-shadow:0 6px 18px rgba(217,119,6,.25)}
  .btn:active{transform:scale(.98)}
  .taxa{padding:.65rem .8rem;background:var(--bg);border-radius:.6rem;font-weight:700;font-size:.95rem;margin-top:.25rem}
  .msg{padding:1rem;background:#fff7ed;border:1px solid #fde68a;border-radius:.7rem;color:#92400e;margin-bottom:1rem;font-size:.9rem}
  .cookie-banner{position:fixed;bottom:0;left:0;right:0;background:#2a2a2a;color:#fff;padding:1rem 1rem;z-index:100;font-size:.9rem;display:none}
  .cookie-banner.show{display:block}
  .cookie-banner button{background:var(--accent);color:#fff;border:none;padding:.5rem .8rem;border-radius:.4rem;font-weight:600;margin-top:.5rem;cursor:pointer}
  footer{margin-top:2rem;padding:2rem 0;text-align:center;color:var(--sub);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-block" aria-label="OF"><div class="logo-sigla">OF</div><div class="logo-text">Ofício de Diárias</div></a>
    <nav class="nav-center"><a href="index.html">Home</a><a href="diarias.html">Diárias</a></nav>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main class="wrap">
  <h1>Cadastrar uma diária</h1>

  <div id="aviso" class="msg hidden" style="display:none">Você precisa estar logado como contratante para publicar. <a href="login.html">Entre aqui</a>.</div>

  <div id="form-area" class="card">
    <h2>Dados da vaga</h2>
    <form onsubmit="event.preventDefault(); publicar();" style="display:grid;gap:.75rem">
      <div style="display:grid;gap:.75rem;grid-template-columns:1fr 1fr">
        <div><label for="v-nome">Nome do contratante</label><input id="v-nome" type="text" required /></div>
        <div><label for="v-tel">Telefone / WhatsApp</label><input id="v-tel" type="tel" required /></div>
      </div>
      <div style="display:grid;gap:.75rem;grid-template-columns:1fr 1fr">
        <div><label for="v-local">Local / Bairro</label><input id="v-local" type="text" required /></div>
        <div><label for="v-dur">Duração (horas ou dias)</label><input id="v-dur" type="text" required /></div>
      </div>
      <div><label for="v-desc">Descrição do serviço</label><textarea id="v-desc" rows="3" placeholder="Ex: limpeza completa, pós-obra..." required></textarea></div>
      <div style="display:grid;gap:.75rem;grid-template-columns:1fr 1fr">
        <div><label for="v-valor">Valor do serviço (R$)</label><input id="v-valor" type="number" min="0" step="10" required /></div>
        <div><label>Taxa de publicação</label><div id="taxa-display" class="taxa">Calcular ao digitar</div></div>
      </div>
      <button type="submit" class="btn">Enviar diária</button>
    </form>
  </div>
</main>

<footer>
  <p><strong>OF.</strong> <a href="index.html">Home</a> · <a href="vagas.html">Diárias</a> · <a href="perfil.html">Perfil</a></p>
</footer>

<script>
let logged = JSON.parse(localStorage.getItem('diarias_logged') || 'null');
if(!logged || (logged.tipo !== 'contratando' && logged.tipo !== 'ambos' && logged.tipo !== 'admin')){
  document.getElementById('form-area').classList.add('hidden');
  document.getElementById('aviso').style.display='block';
} else {
  document.getElementById('aviso').classList.add('hidden');
}

function buildNav(){
  const right = document.getElementById('nav-right');
  if(logged && logged.user){
    right.innerHTML = `<button onclick="toggleDrop(event)" class="btn-small">${esc(logged.nome||logged.user)} ▼</button>
      <div id="drop-menu" class="dropdown"><a href="perfil.html">Perfil</a><a href="#" onclick="sair();return false;">Sair</a></div>`;
  } else {
    right.innerHTML = `<a href="login.html" class="btn-small">Logar</a> <a href="cadastro.html" class="btn-ghost-small">Criar</a>`;
  }
}
function toggleDrop(e){ e.stopPropagation(); const m=document.getElementById('drop-menu'); if(m) m.classList.toggle('show'); }
document.addEventListener('click', () => { const m=document.getElementById('drop-menu'); if(m) m.classList.remove('show'); });
function sair(){ localStorage.setItem('diarias_logged','null'); location.reload(); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
buildNav();

const inp = document.getElementById('v-valor');
const disp = document.getElementById('taxa-display');
if(inp && disp){
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value) || 0;
    let taxa = (v <= 150) ? 20 : Math.max(10, v*0.10);
    disp.textContent = 'Taxa: R$ ' + taxa.toFixed(2).replace('.',',') + ' (pay via PIX)';
  });
}

function publicar(){
  const nome = document.getElementById('v-nome').value.trim();
  const tel = document.getElementById('v-tel').value.trim();
  const local = document.getElementById('v-local').value.trim();
  const desc = document.getElementById('v-desc').value.trim();
  const dur = document.getElementById('v-dur').value.trim();
  const valor = parseFloat(document.getElementById('v-valor').value) || 0;
  if(!nome||!local||!tel||!desc||!dur||!valor){ alert('Preencha todos os campos.'); return; }
  let vagas = JSON.parse(localStorage.getItem('diarias_vagas') || '[]');
  vagas.unshift({id:Date.now(), nome, local, tel, desc, dur, valor, autor:(logged?logged.nome||logged.user:nome)});
  localStorage.setItem('diarias_vagas', JSON.stringify(vagas));
  alert('Diária publicada! Admin pode excluir a qualquer momento.');
  document.getElementById('form-area').innerHTML = '<div class="card"><h2>Publicada!</h2><p>Você pode ver em <a href="diarias.html">Diárias</a>.</p></div>';
}
</script>

<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Aviso de cookies"><div class="wrap" style="padding:0"><strong>Armazenamento local.</strong> Este site usa localStorage para guardar login, vagas e preferências. <button onclick="aceitarCookies()">Entendi</button></div></div>
<script>function aceitarCookies(){ localStorage.setItem('diarias_cookies','1'); document.getElementById('cookie-banner').classList.remove('show'); } if(!localStorage.getItem('diarias_cookies')) document.getElementById('cookie-banner').classList.add('show');</script>

</body>
</html>
