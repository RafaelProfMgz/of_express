<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Criar conta — OF</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-pagina="cadastro">

<div id="of-header"></div>

<main class="wrap">
  <div class="page-head">
    <h1>Criar conta</h1>
    <p>Leva menos de um minuto. Ao criar a conta você já entra direto no site.</p>
  </div>

  <section class="card">
    <form class="form" id="form-cadastro" novalidate>
      <div>
        <label for="c-nome">Nome completo</label>
        <input id="c-nome" type="text" autocomplete="name" placeholder="Ex: Ana Paula Souza" required>
      </div>
      <div class="grid2">
        <div>
          <label for="c-user">Usuário</label>
          <input id="c-user" type="text" autocomplete="username" placeholder="ana.paula" required>
        </div>
        <div>
          <label for="c-tel">WhatsApp</label>
          <input id="c-tel" type="tel" autocomplete="tel" placeholder="(11) 99999-9999" required>
        </div>
      </div>
      <div>
        <label for="c-email">E-mail</label>
        <input id="c-email" type="email" autocomplete="email" placeholder="seu@email.com" required>
      </div>
      <div class="grid2">
        <div>
          <label for="c-pass">Senha</label>
          <input id="c-pass" type="password" autocomplete="new-password" placeholder="Mínimo 4 caracteres" required>
        </div>
        <div>
          <label for="c-pass2">Repetir senha</label>
          <input id="c-pass2" type="password" autocomplete="new-password" placeholder="Repita a senha" required>
        </div>
      </div>
      <div>
        <label for="c-cidade">Cidade</label>
        <input id="c-cidade" type="text" autocomplete="address-level2" placeholder="Ex: São Paulo — SP">
      </div>
      <div>
        <label for="c-tipo">Você entra no site como</label>
        <select id="c-tipo" required>
          <option value="contratando">Contratante — quero publicar diárias</option>
          <option value="diarista">Diarista — quero pegar diárias</option>
          <option value="ambos" selected>Os dois — contratar e trabalhar</option>
        </select>
        <p class="field-help">Só contratantes (ou "os dois") podem publicar diárias.</p>
      </div>
      <label class="check">
        <input type="checkbox" id="c-aceite" required>
        <span>Li e aceito os <a href="termos.html" target="_blank">termos de uso</a> e a <a href="privacidade.html" target="_blank">política de privacidade</a>.</span>
      </label>
      <div id="c-erro" class="msg err hidden" role="alert"></div>
      <button type="submit" class="btn">Criar conta e entrar</button>
      <p class="small center mt1">Já tem conta? <a href="login.html">Faça login</a>.</p>
    </form>
  </section>
</main>

<div id="of-footer"></div>

<script src="assets/app.js"></script>
<script>
document.addEventListener('of:pronto', function () {
  var params = new URLSearchParams(location.search);
  var proximo = params.get('proximo') || '';
  var permitidos = ['cadastrar-diaria.html', 'perfil.html', 'diarias.html', 'index.html', 'contato.html'];
  var destino = permitidos.indexOf(proximo) >= 0 ? proximo : 'perfil.html';

  if (OF.logado()) { location.replace(destino); return; }

  document.getElementById('form-cadastro').addEventListener('submit', function (e) {
    e.preventDefault();
    var erro = document.getElementById('c-erro');
    function falhar(m) { erro.textContent = m; erro.classList.remove('hidden'); }

    var pass = document.getElementById('c-pass').value;
    if (pass !== document.getElementById('c-pass2').value) return falhar('As senhas não conferem.');
    if (!document.getElementById('c-aceite').checked) return falhar('É preciso aceitar os termos para criar a conta.');
    var email = document.getElementById('c-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return falhar('Informe um e-mail válido.');
    if (OF.digitos(document.getElementById('c-tel').value).length < 10) return falhar('Informe um WhatsApp válido com DDD.');

    // cadastrar() já abre a sessão do novo usuário (login automático)
    var r = OF.cadastrar({
      nome: document.getElementById('c-nome').value,
      user: document.getElementById('c-user').value,
      email: email,
      tel: document.getElementById('c-tel').value,
      cidade: document.getElementById('c-cidade').value,
      tipo: document.getElementById('c-tipo').value,
      pass: pass
    });
    if (!r.ok) return falhar(r.erro);
    location.href = destino + '?novo=1';
  });
});
</script>
</body>
</html>
