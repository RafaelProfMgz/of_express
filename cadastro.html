<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Criar conta — OF</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap');
  :root{--bg:#f6f5f0;--card:#fff;--accent:#d97706;--text:#2a2a2a;--sub:#6b6b6b;--line:#ebeae5;--dark:#2a2a2a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:16px;}
  a{color:var(--accent);text-decoration:none}
  .wrap{width:min(480px,95vw);margin-inline:auto;padding:1rem 1rem 3rem}
  header.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1rem}
  .header-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .logo-block{display:flex;align-items:center;gap:.6rem}
  .logo-sigla{width:36px;height:36px;border-radius:.5rem;background:var(--dark);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.1rem;flex-shrink:0}
  .logo-text{font-weight:700;font-size:.85rem;line-height:1.15;color:var(--text)}
  .nav-center{display:flex;gap:.85rem;font-weight:600;font-size:.85rem}
  .nav-right{position:relative}
  .btn-small{background:var(--accent);color:#fff;padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;border:none;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.03)}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;margin:1rem 0 .5rem}
  label{font-weight:600;font-size:.82rem;display:block;margin:.8rem 0 .25rem}
  input,select{width:100%;padding:.75rem .8rem;border:1px solid #ddd;border-radius:.6rem;font-family:inherit;font-size:.95rem}
  .btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;padding:.9rem;border-radius:.7rem;font-weight:700;font-size:1rem;border:none;margin-top:.5rem;cursor:pointer;box-shadow:0 6px 18px rgba(217,119,6,.25)}
  .btn:active{transform:scale(.98)}
  .small{font-size:.78rem;color:var(--sub)}
  .grid2{display:grid;gap:.6rem;grid-template-columns:1fr 1fr}
  @media(max-width:420px){.grid2{grid-template-columns:1fr}}
  footer{margin-top:2rem;padding:2rem 0;text-align:center;color:var(--sub);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-block" aria-label="OF"><div class="logo-sigla">OF</div><div class="logo-text">Ofício de Diárias</div></a>
    <nav class="nav-center"><a href="index.html">Home</a><a href="diarias.html">Diárias</a></nav>
    <div class="nav-right"><a href="login.html" class="btn-small">Logar</a></div>
  </div>
</header>

<main class="wrap">
  <h1>Criar conta</h1>
  <div class="card">
    <h2>Cadastro de contratante</h2>
    <p class="small">Preencha todos os campos para poder publicar vagas.</p>
    <form onsubmit="event.preventDefault(); doCadastro();" style="display:grid;gap:.6rem">
      <div class="grid2">
        <div><label for="c-user">Usuário</label><input id="c-user" type="text" placeholder="Seu nome de usuário" required/></div>
        <div><label for="c-email">E-mail</label><input id="c-email" type="email" placeholder="seu@email.com" required/></div>
      </div>
      <div class="grid2">
        <div><label for="c-pass">Senha</label><input id="c-pass" type="password" placeholder="Crie uma senha" required/></div>
        <div><label for="c-tel">Telefone / WhatsApp</label><input id="c-tel" type="tel" placeholder="(11) 99999-9999" required/></div>
      </div>
      <div>
        <label for="c-tipo">Tipo de usuário</label>
        <select id="c-tipo" required>
          <option value="">Selecione...</option>
          <option value="contratando">Só contratando (publicar vagas)</option>
          <option value="diarista">Só procurando diária</option>
          <option value="ambos">Ambos (contratar e trabalhar)</option>
        </select>
      </div>
      <button type="submit" class="btn">Criar conta</button>
      <p class="small">Já tem conta? <a href="login.html">Faça login</a>.</p>
    </form>
  </div>
</main>

<footer>
  <p><strong>OF.</strong> <a href="index.html">Home</a> · <a href="termos.html">Termos</a> · <a href="privacidade.html">Privacidade</a></p>
</footer>

<script>
function doCadastro(){
  const user = document.getElementById('c-user').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const pass = document.getElementById('c-pass').value;
  const tel = document.getElementById('c-tel').value.trim();
  const tipo = document.getElementById('c-tipo').value;
  if(!user||!email||!pass||!tel||!tipo){ alert('Preencha todos os campos.'); return; }
  let users = JSON.parse(localStorage.getItem('diarias_users') || '[]');
  if(users.find(u=>u.user===user)){ alert('Já existe usuário com esse nome.'); return; }
  users.push({user, email, pass, tel, tipo, name:user, criado:new Date().toISOString()});
  localStorage.setItem('diarias_users', JSON.stringify(users));
  alert('Conta criada! Faça login.');
  location.href='login.html';
}
</script>

</body>
</html>
