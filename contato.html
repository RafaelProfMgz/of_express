<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contato — OF</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter&family=Playfair+Display:wght@700&display=swap');
:root{--bg:#f6f5f0;--card:#fff;--accent:#d97706;--text:#2a2a2a;--sub:#6b6b6b;--line:#ebeae5;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:16px;}
.wrap{width:min(480px,95vw);margin-inline:auto;padding:1rem 1rem 3rem}
header{background:linear-gradient(135deg,#2a2a2a 0%,#4a3f2a 100%);color:#fff;padding:2rem 1rem 1.5rem;border-radius:0 0 1rem 1rem;margin:-1rem -1rem 1.5rem}
h1{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;margin-bottom:.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin-bottom:1rem}
label{font-weight:600;font-size:.82rem;display:block;margin:.8rem 0 .25rem}
input,textarea{width:100%;padding:.7rem .8rem;border:1px solid #ddd;border-radius:.6rem;font-family:inherit;font-size:.95rem}
textarea{resize:vertical;min-height:80px}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;padding:.9rem;border-radius:.7rem;font-weight:700;font-size:1rem;border:none;margin-top:.5rem;cursor:pointer;box-shadow:0 6px 18px rgba(217,119,6,.25)}
a{color:var(--accent)}
</style>
</head>
<body>
<header><div class="wrap"><div style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:.85rem;opacity:.8">OF — Administradora</div><h1>Contato com a admin</h1><p>Fale diretamente com a administradora do grupo.</p></div></header>
<main class="wrap">
<div class="card">
<h2>Enviar mensagem</h2>
<form onsubmit="event.preventDefault(); alert('Mensagem enviada! A admin responderá pelo WhatsApp ou e-mail.');">
<div><label for="nome">Seu nome</label><input id="nome" type="text" placeholder="Seu nome" required /></div>
<div><label for="email">E-mail</label><input id="email" type="email" placeholder="seu@email.com" required /></div>
<div><label for="msg">Mensagem</label><textarea id="msg" rows="3" placeholder="O que precisa?" required></textarea></div>
<button type="submit" class="btn">Enviar para admin</button>
</form>
</div>
<div class="card">
<h2>Contato direto</h2>
<p><strong>WhatsApp:</strong> <a href="https://wa.me/5511000000000">(11) 00000-0000</a></p>
<p><strong>E-mail:</strong> <a href="mailto:seu@email.com">seu@email.com</a></p>
<p>Troque para os seus dados de contato.</p>
</div>
</main>
<footer style="text-align:center;padding:2rem 1rem;color:#6b6b6b;font-size:.85rem;border-top:1px solid #ebeae5"><p><a href="index.html">← Voltar</a> · <a href="termos.html">Termos</a> · <a href="privacidade.html">Privacidade</a></p></footer>
</body>
</html>
