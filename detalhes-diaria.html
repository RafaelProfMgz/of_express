<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Detalhes da diária — OF</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .voltar{display:inline-block;font-size:.85rem;font-weight:600;margin-top:1rem}
  .destaque-valor{display:flex;align-items:baseline;gap:.5rem;margin:.6rem 0 .2rem}
  .destaque-valor strong{font-size:1.9rem;font-family:var(--serif);color:var(--accent-dark);line-height:1}
  .destaque-valor span{font-size:.85rem;color:var(--sub)}
  .cta-box{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius);padding:1.2rem;margin-bottom:1rem}
  .cta-box h2{font-family:var(--serif);font-size:1.2rem;margin-bottom:.2rem;color:#92400e}
  .cta-box>p{font-size:.9rem;color:#92400e;margin-bottom:.5rem}
  .cta-box label{color:#78350f}
  .previa{background:#fff;border:1px solid var(--accent-line);border-radius:.6rem;padding:.75rem;font-size:.82rem;color:var(--sub);white-space:pre-wrap;margin-top:.6rem;max-height:9rem;overflow:auto}
</style>
</head>
<body data-pagina="diarias">

<div id="of-header"></div>

<main class="wrap">
  <div id="conteudo"></div>
</main>

<div id="of-footer"></div>

<script src="assets/app.js"></script>
<script>
document.addEventListener('of:pronto', function () {
  var id = new URLSearchParams(location.search).get('id');
  var d = OF.diaria(id);
  var alvo = document.getElementById('conteudo');

  if (!d) {
    alvo.innerHTML = '<div class="page-head"><h1>Diária não encontrada</h1>' +
      '<p>Esta diária pode ter sido preenchida ou removida pela administradora.</p></div>' +
      '<a href="diarias.html" class="btn">Ver diárias disponíveis</a>';
    return;
  }

  var taxa = OF.taxa(d.valor);
  var titulo = d.titulo || d.desc;
  document.title = titulo + ' — OF';

  alvo.innerHTML =
    '<a href="diarias.html" class="voltar">← Todas as diárias</a>' +
    '<div class="page-head"><h1>' + OF.esc(titulo) + '</h1>' +
      '<p>' + OF.esc(d.local) + (d.cidade ? ' · ' + OF.esc(d.cidade) : '') + '</p></div>' +

    '<section class="card">' +
      '<div class="destaque-valor"><strong>' + OF.brl(d.valor) + '</strong><span>' + OF.esc(d.dur || '') + '</span></div>' +
      '<div class="tags">' +
        '<span class="tag accent">' + OF.esc(OF.labelTipo(d.tipo)) + '</span>' +
        (d.periodo ? '<span class="tag">Período: ' + OF.esc(d.periodo) + '</span>' : '') +
        (d.criado ? '<span class="tag">Publicada em ' + OF.esc(OF.dataBR(d.criado)) + '</span>' : '') +
      '</div>' +
      '<h2 class="mt1" style="margin-top:1.2rem">Descrição do serviço</h2>' +
      '<p style="white-space:pre-wrap">' + OF.esc(d.desc) + '</p>' +
      '<dl class="dl" style="margin-top:1rem">' +
        '<div class="row"><dt>Contratante</dt><dd>' + OF.esc(d.nome) + '</dd></div>' +
        '<div class="row"><dt>Local</dt><dd>' + OF.esc(d.local) + '</dd></div>' +
        (d.cidade ? '<div class="row"><dt>Cidade</dt><dd>' + OF.esc(d.cidade) + '</dd></div>' : '') +
        '<div class="row"><dt>Duração</dt><dd>' + OF.esc(d.dur || '—') + '</dd></div>' +
        '<div class="row"><dt>Valor do serviço</dt><dd>' + OF.brl(d.valor) + '</dd></div>' +
        '<div class="row"><dt>WhatsApp</dt><dd>' + OF.esc(d.tel) + '</dd></div>' +
      '</dl>' +
    '</section>' +

    '<section class="cta-box" id="contato">' +
      '<h2>Entrar em contato</h2>' +
      '<p>Preencha os dados abaixo e o WhatsApp do contratante abre com a mensagem pronta. Não é preciso ter conta.</p>' +
      '<form class="form" id="form-contato" novalidate>' +
        '<div class="grid2">' +
          '<div><label for="k-nome">Seu nome</label><input id="k-nome" type="text" placeholder="Seu nome" required></div>' +
          '<div><label for="k-tel">Seu telefone</label><input id="k-tel" type="tel" placeholder="(11) 99999-9999" required></div>' +
        '</div>' +
        '<div class="grid2">' +
          '<div><label for="k-data">Disponível a partir de</label><input id="k-data" type="date"></div>' +
          '<div><label for="k-exp">Experiência</label>' +
            '<select id="k-exp">' +
              '<option value="">Não informar</option>' +
              '<option value="Sem experiência formal">Sem experiência formal</option>' +
              '<option value="Menos de 1 ano">Menos de 1 ano</option>' +
              '<option value="1 a 3 anos">1 a 3 anos</option>' +
              '<option value="Mais de 3 anos">Mais de 3 anos</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div><label for="k-msg">Mensagem</label>' +
          '<textarea id="k-msg" rows="3" placeholder="Conte rapidamente por que você é boa opção para esta diária."></textarea></div>' +
        '<div id="k-erro" class="msg err hidden" role="alert"></div>' +
        '<button type="submit" class="btn-whatsapp">' +
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.35-.53.05-1.02.14-2.9-.6-2.26-.9-3.68-3.24-3.79-3.39-.11-.15-.9-1.2-.9-2.29 0-1.09.57-1.62.77-1.85.2-.22.44-.28.59-.28l.42.01c.14 0 .32-.05.5.38.18.44.63 1.54.68 1.65.05.11.09.24.02.39-.08.15-.15.24-.29.39-.14.15-.22.24-.32.39-.1.15-.21.31-.09.53.12.22.53.9 1.15 1.46.79.72 1.45.94 1.67 1.05.22.11.35.09.48-.06.13-.15.55-.64.7-.86.15-.22.3-.18.5-.11.2.07 1.29.61 1.51.72.22.11.37.17.42.26.05.1.05.58-.19 1.26z"/></svg>' +
          'Enviar no WhatsApp' +
        '</button>' +
        '<div class="previa" id="previa" aria-live="polite"></div>' +
        '<p class="small">Ao enviar, o WhatsApp <strong>' + OF.esc(d.tel) + '</strong> abre em outra aba com o texto acima.</p>' +
      '</form>' +
    '</section>' +

    '<section class="card">' +
      '<h2>Como funciona o pagamento</h2>' +
      '<p class="sub">O valor do serviço é combinado direto com o contratante. A taxa de intermediação desta diária (' +
        OF.brl(taxa) + ') já foi paga por quem publicou.</p>' +
      '<a href="contato.html" class="btn btn-outline">Problema com esta diária? Fale com a admin</a>' +
    '</section>' +

    '<section aria-labelledby="t-outras">' +
      '<div class="section-title"><h2 id="t-outras">Outras diárias</h2><a href="diarias.html">Ver todas →</a></div>' +
      '<div id="outras"></div>' +
    '</section>';

  // Outras diárias (mesmo tipo primeiro)
  var outras = OF.diarias().filter(function (x) { return Number(x.id) !== Number(d.id); })
    .sort(function (a, b) { return (b.tipo === d.tipo) - (a.tipo === d.tipo); })
    .slice(0, 2);
  document.getElementById('outras').innerHTML = outras.length
    ? outras.map(OF.cardDiaria).join('')
    : '<div class="empty">Nenhuma outra diária no momento.</div>';

  // Prévia da mensagem + envio
  var f = {
    nome: document.getElementById('k-nome'),
    tel: document.getElementById('k-tel'),
    data: document.getElementById('k-data'),
    exp: document.getElementById('k-exp'),
    msg: document.getElementById('k-msg')
  };
  function textoMensagem() {
    var l = ['Olá, ' + d.nome + '! Vi a diária "' + titulo + '" no site OF — Ofício de Diárias.'];
    l.push('');
    l.push('Serviço: ' + OF.labelTipo(d.tipo) + ' · ' + (d.dur || '') + ' · ' + OF.brl(d.valor));
    l.push('Local: ' + d.local);
    l.push('');
    l.push('Meu nome: ' + (f.nome.value.trim() || '—'));
    l.push('Meu telefone: ' + (f.tel.value.trim() || '—'));
    if (f.data.value) {
      var p = f.data.value.split('-');
      l.push('Disponível a partir de: ' + p[2] + '/' + p[1] + '/' + p[0]);
    }
    if (f.exp.value) l.push('Experiência: ' + f.exp.value);
    if (f.msg.value.trim()) { l.push(''); l.push(f.msg.value.trim()); }
    l.push('');
    l.push('Podemos combinar os detalhes?');
    return l.join('\n');
  }
  function atualizarPrevia() { document.getElementById('previa').textContent = textoMensagem(); }
  Object.keys(f).forEach(function (k) { f[k].addEventListener('input', atualizarPrevia); });
  f.exp.addEventListener('change', atualizarPrevia);
  atualizarPrevia();

  document.getElementById('form-contato').addEventListener('submit', function (e) {
    e.preventDefault();
    var erro = document.getElementById('k-erro');
    if (f.nome.value.trim().length < 2) {
      erro.textContent = 'Informe seu nome.'; erro.classList.remove('hidden'); return;
    }
    if (OF.digitos(f.tel.value).length < 10) {
      erro.textContent = 'Informe um telefone válido com DDD.'; erro.classList.remove('hidden'); return;
    }
    erro.classList.add('hidden');

    OF.registrarContato({
      diariaId: d.id, diariaTitulo: titulo,
      nome: f.nome.value.trim(), tel: f.tel.value.trim(),
      data: f.data.value, experiencia: f.exp.value, mensagem: f.msg.value.trim()
    });

    var url = 'https://wa.me/' + OF.waNumero(d.tel) + '?text=' + encodeURIComponent(textoMensagem());
    window.open(url, '_blank', 'noopener');

    var ok = document.createElement('div');
    ok.className = 'msg ok';
    ok.setAttribute('role', 'status');
    ok.innerHTML = '<strong>Contato registrado.</strong> O WhatsApp abriu em outra aba com sua mensagem. Se não abriu, ' +
      '<a href="' + url + '" target="_blank" rel="noopener">clique aqui</a>.';
    this.parentNode.insertBefore(ok, this);
    ok.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Rola até o formulário quando vier de #contato
  if (location.hash === '#contato') {
    document.getElementById('contato').scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
