<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="Todas as diárias disponíveis no OF. Filtre por tipo de serviço, valor, cidade e duração — e entre em contato sem precisar de conta.">
<title>Diárias disponíveis — OF</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .filtros{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);margin-bottom:1rem}
  .filtros .linha{display:grid;gap:.6rem;grid-template-columns:1fr 1fr}
  .filtros label{margin-top:.55rem}
  .filtros .busca{position:relative}
  .filtros .busca input{padding-left:2.2rem}
  .filtros .busca svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:var(--sub)}
  .filtros-topo{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .filtros-topo h2{font-family:var(--serif);font-size:1.05rem}
  .toggle-filtros{background:none;border:none;font-family:inherit;font-weight:600;font-size:.8rem;color:var(--accent);cursor:pointer}
  .resultado-bar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:.25rem 0 .85rem;font-size:.85rem;color:var(--sub)}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.85rem}
  .chip{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-dark);border-radius:2rem;padding:.2rem .6rem;font-size:.75rem;font-weight:600;display:inline-flex;gap:.35rem;align-items:center}
  .chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:.9rem;line-height:1;padding:0}
</style>
</head>
<body data-pagina="diarias">

<div id="of-header"></div>

<main class="wrap">
  <div class="page-head">
    <h1>Diárias disponíveis</h1>
    <p>Veja e entre em contato mesmo sem ter conta. Conta só é necessária para publicar.</p>
  </div>

  <div id="cta-publicar"></div>

  <!-- Filtros -->
  <section class="filtros" aria-labelledby="t-filtros">
    <div class="filtros-topo">
      <h2 id="t-filtros">Filtrar</h2>
      <button type="button" class="toggle-filtros" id="toggle-filtros" aria-expanded="false" aria-controls="filtros-corpo">Mais filtros ▾</button>
    </div>

    <label for="f-texto" class="sr-only">Buscar</label>
    <div class="busca" style="margin-top:.6rem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="f-texto" type="search" placeholder="Buscar por título, bairro, descrição…">
    </div>

    <div id="filtros-corpo" class="hidden">
      <div class="linha">
        <div>
          <label for="f-tipo">Tipo de serviço</label>
          <select id="f-tipo"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="f-cidade">Cidade</label>
          <select id="f-cidade"><option value="">Todas</option></select>
        </div>
      </div>
      <div class="linha">
        <div>
          <label for="f-min">Valor mínimo (R$)</label>
          <input id="f-min" type="number" min="0" step="10" placeholder="0">
        </div>
        <div>
          <label for="f-max">Valor máximo (R$)</label>
          <input id="f-max" type="number" min="0" step="10" placeholder="Sem limite">
        </div>
      </div>
      <div class="linha">
        <div>
          <label for="f-periodo">Período</label>
          <select id="f-periodo"><option value="">Qualquer</option></select>
        </div>
        <div>
          <label for="f-ordem">Ordenar por</label>
          <select id="f-ordem">
            <option value="recentes">Mais recentes</option>
            <option value="menor">Menor valor</option>
            <option value="maior">Maior valor</option>
            <option value="titulo">Título (A–Z)</option>
          </select>
        </div>
      </div>
      <button type="button" class="btn btn-outline" id="btn-limpar">Limpar filtros</button>
    </div>
  </section>

  <div class="resultado-bar">
    <span id="contador">—</span>
    <a href="cadastrar-diaria.html" class="small" style="font-weight:600">+ Publicar diária</a>
  </div>

  <div class="chips" id="chips-ativos"></div>

  <div id="lista-diarias" aria-live="polite"></div>
</main>

<div id="of-footer"></div>

<script src="assets/app.js"></script>
<script>
document.addEventListener('of:pronto', function () {
  var todas = OF.diarias();
  var els = {
    texto: document.getElementById('f-texto'),
    tipo: document.getElementById('f-tipo'),
    cidade: document.getElementById('f-cidade'),
    min: document.getElementById('f-min'),
    max: document.getElementById('f-max'),
    periodo: document.getElementById('f-periodo'),
    ordem: document.getElementById('f-ordem')
  };

  // CTA de publicar depende do login
  document.getElementById('cta-publicar').innerHTML = OF.podePublicar()
    ? '<a href="cadastrar-diaria.html" class="btn" style="margin-bottom:1rem">+ Publicar uma diária</a>'
    : (OF.logado()
        ? ''
        : '<div class="msg">Tem uma diária para oferecer? <a href="login.html?proximo=cadastrar-diaria.html"><strong>Entre na sua conta</strong></a> para publicar.</div>');

  // Opções dinâmicas
  OF.TIPOS.forEach(function (t) {
    if (todas.some(function (d) { return d.tipo === t[0]; })) {
      els.tipo.insertAdjacentHTML('beforeend', '<option value="' + t[0] + '">' + t[1] + '</option>');
    }
  });
  function unicos(campo) {
    return todas.map(function (d) { return d[campo]; })
      .filter(function (v, i, a) { return v && a.indexOf(v) === i; }).sort();
  }
  unicos('cidade').forEach(function (c) {
    els.cidade.insertAdjacentHTML('beforeend', '<option value="' + OF.esc(c) + '">' + OF.esc(c) + '</option>');
  });
  unicos('periodo').forEach(function (p) {
    els.periodo.insertAdjacentHTML('beforeend', '<option value="' + OF.esc(p) + '">' + OF.esc(p) + '</option>');
  });

  // Pré-filtro por URL: diarias.html?tipo=pos-obra
  var qs = new URLSearchParams(location.search);
  if (qs.get('tipo')) els.tipo.value = qs.get('tipo');
  if (qs.get('q')) els.texto.value = qs.get('q');

  var abertos = !!(qs.get('tipo') || qs.get('q'));
  var corpo = document.getElementById('filtros-corpo');
  var toggle = document.getElementById('toggle-filtros');
  function aplicarToggle() {
    corpo.classList.toggle('hidden', !abertos);
    toggle.textContent = abertos ? 'Menos filtros ▴' : 'Mais filtros ▾';
    toggle.setAttribute('aria-expanded', abertos ? 'true' : 'false');
  }
  toggle.addEventListener('click', function () { abertos = !abertos; aplicarToggle(); });
  aplicarToggle();

  function filtrar() {
    var texto = els.texto.value.trim().toLowerCase();
    var tipo = els.tipo.value, cidade = els.cidade.value, periodo = els.periodo.value;
    var min = parseFloat(els.min.value), max = parseFloat(els.max.value);

    var res = todas.filter(function (d) {
      if (texto) {
        var alvo = [d.titulo, d.desc, d.local, d.cidade, d.nome, OF.labelTipo(d.tipo)].join(' ').toLowerCase();
        if (alvo.indexOf(texto) < 0) return false;
      }
      if (tipo && d.tipo !== tipo) return false;
      if (cidade && d.cidade !== cidade) return false;
      if (periodo && d.periodo !== periodo) return false;
      if (!isNaN(min) && Number(d.valor) < min) return false;
      if (!isNaN(max) && Number(d.valor) > max) return false;
      return true;
    });

    var ordem = els.ordem.value;
    res.sort(function (a, b) {
      if (ordem === 'menor') return a.valor - b.valor;
      if (ordem === 'maior') return b.valor - a.valor;
      if (ordem === 'titulo') return String(a.titulo || a.desc).localeCompare(String(b.titulo || b.desc), 'pt-BR');
      return new Date(b.criado || 0) - new Date(a.criado || 0) || b.id - a.id;
    });

    document.getElementById('contador').textContent =
      res.length + (res.length === 1 ? ' diária encontrada' : ' diárias encontradas') +
      (res.length !== todas.length ? ' de ' + todas.length : '');

    // Chips dos filtros ativos
    var ativos = [];
    if (texto) ativos.push(['texto', '“' + els.texto.value.trim() + '”']);
    if (tipo) ativos.push(['tipo', OF.labelTipo(tipo)]);
    if (cidade) ativos.push(['cidade', cidade]);
    if (periodo) ativos.push(['periodo', periodo]);
    if (!isNaN(min)) ativos.push(['min', 'a partir de ' + OF.brl(min)]);
    if (!isNaN(max)) ativos.push(['max', 'até ' + OF.brl(max)]);
    var chips = document.getElementById('chips-ativos');
    chips.innerHTML = ativos.map(function (a) {
      return '<span class="chip">' + OF.esc(a[1]) + '<button type="button" data-limpa="' + a[0] + '" aria-label="Remover filtro">×</button></span>';
    }).join('');
    chips.querySelectorAll('[data-limpa]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.limpa;
        if (k === 'texto') els.texto.value = ''; else els[k].value = '';
        filtrar();
      });
    });

    document.getElementById('lista-diarias').innerHTML = res.length
      ? res.map(OF.cardDiaria).join('')
      : '<div class="empty"><strong>Nenhuma diária com esses filtros.</strong><br>Tente ampliar a faixa de valor ou limpar a busca.</div>';
  }

  Object.keys(els).forEach(function (k) {
    els[k].addEventListener(k === 'texto' ? 'input' : 'change', filtrar);
  });
  els.min.addEventListener('input', filtrar);
  els.max.addEventListener('input', filtrar);

  document.getElementById('btn-limpar').addEventListener('click', function () {
    Object.keys(els).forEach(function (k) { if (k !== 'ordem') els[k].value = ''; });
    els.ordem.value = 'recentes';
    filtrar();
  });

  filtrar();
});
</script>
</body>
</html>
