<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Diárias — Listagem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap');
  :root{--bg:#f6f5f0;--card:#fff;--accent:#d97706;--text:#2a2a2a;--sub:#6b6b6b;--line:#ebeae5;--dark:#2a2a2a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:16px;}
  a{color:var(--accent);text-decoration:none}
  .wrap{width:min(480px,95vw);margin-inline:auto;padding:1rem 1rem 3rem}
  header.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1rem}
  .header-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .logo-block{display:flex;align-items:center;gap:.6rem}
  .logo-sigla{width:36px;height:36px;border-radius:.5rem;background:var(--dark);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.1rem;flex-shrink:0}
  .logo-text{font-weight:700;font-size:.85rem;line-height:1.15;color:var(--text)}
  .nav-center{display:flex;gap:.85rem;font-weight:600;font-size:.85rem}
  nav a{color:var(--text)}
  .nav-right{position:relative}
  .btn-small{background:var(--accent);color:#fff;padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;border:none;cursor:pointer}
  .btn-ghost-small{background:transparent;border:1px solid #ddd;color:var(--text);padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;cursor:pointer}
  .dropdown{position:absolute;right:0;top:2.4rem;background:#fff;border:1px solid var(--line);border-radius:.7rem;padding:.4rem;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.08);display:none}
  .dropdown.show{display:block}
  .dropdown a{display:block;padding:.55rem .6rem;border-radius:.4rem;font-size:.9rem;color:var(--text);font-weight:600}
  .dropdown a:hover{background:var(--bg)}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;margin:1.5rem 0 .5rem;letter-spacing:-.01em}
  .filtros{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .filtros select, .filtros input{padding:.55rem .6rem;border:1px solid #ddd;border-radius:.5rem;font-family:inherit;font-size:.9rem}
  .filtros button{background:var(--accent);color:#fff;border:none;padding:.55rem .8rem;border-radius:.5rem;font-weight:600;font-size:.85rem;cursor:pointer}
  .destaque-card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.1rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.03)}
  .destaque-card h2{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;margin-bottom:.25rem}
  .destaque-card .meta{font-size:.82rem;color:var(--sub)}
  .destaque-card a.btn-small{display:inline-block;background:var(--accent);color:#fff;padding:.35rem .7rem;border-radius:.4rem;font-weight:600;font-size:.82rem;margin-top:.5rem}
  .msg{padding:1rem;background:#fff7ed;border:1px solid #fde68a;border-radius:.7rem;color:#92400e;margin-bottom:1rem;font-size:.9rem}
  footer{margin-top:2rem;padding:2rem 0;text-align:center;color:var(--sub);font-size:.85rem;border-top:1px solid var(--line)}
  .hidden{display:none!important}
  .cookie-banner{position:fixed;bottom:0;left:0;right:0;background:#2a2a2a;color:#fff;padding:1rem 1rem;z-index:100;font-size:.9rem;display:none}
  .cookie-banner.show{display:block}
  .cookie-banner button{background:var(--accent);color:#fff;border:none;padding:.5rem .8rem;border-radius:.4rem;font-weight:600;margin-top:.5rem;cursor:pointer}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-block" aria-label="OF">
      <div class="logo-sigla">OF</div>
      <div class="logo-text">Ofício de Diárias</div>
    </a>
    <nav class="nav-center" aria-label="Principal">
      <a href="index.html">Home</a>
      <a href="diarias.html">Diárias</a>
    </nav>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main class="wrap">
  <h1>Diárias disponíveis</h1>

  <div class="filtros" aria-label="Filtros">
    <input id="f-texto" type="text" placeholder="Buscar (descrição...)" oninput="filtrar()" />
    <select id="f-tipo" onchange="filtrar()">
      <option value="">Todos os tipos</option>
      <option value="residencial">Residencial</option>
      <option value="comercial">Comercial</option>
      <option value="pos-obra">Pós-obra</option>
    </select>
    <button onclick="filtrar()">Filtrar</button>
    <a href="cadastrar-diaria.html" class="btn-small" style="text-decoration:none">+ Cadastrar diária</a>
  </div>

  <div id="lista-diarias"></div>

  <div id="msg-vazio" class="msg hidden" style="display:none">Nenhuma diária encontrada com esses filtros.</div>
</main>

<footer>
  <p><strong>OF.</strong> <a href="index.html">Home</a> · <a href="perfil.html">Perfil</a> · <a href="contato.html">Contato</a></p>
</footer>

<script>
let vagas = JSON.parse(localStorage.getItem('diarias_vagas') || JSON.stringify([
  {id:1, nome:'Ana P.', local:'Av. Main, 450 — Centro', tel:'(11) 99999-0000', desc:'Limpeza completa de apto 2 quartos.', dur:'1 dia (8h)', valor:160, tipo:'residencial'},
  {id:2, nome:'Carlos M.', local:'Rua das Flores, 120 — Jardim', tel:'(11) 98888-1111', desc:'Limpeza pesada pós-reforma.', dur:'2 dias', valor:250, tipo:'pos-obra'},
  {id:3, nome:'Fernanda L.', local:'Rua B, 78 — Norte', tel:'(11) 97777-2222', desc:'Limpeza de escritório 3h.', dur:'3h', valor:90, tipo:'comercial'}
]));

function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function render(vs){
  const div = document.getElementById('lista-diarias');
  if(!vs.length){ div.innerHTML=''; document.getElementById('msg-vazio').style.display='block'; return; }
  document.getElementById('msg-vazio').style.display='none';
  div.innerHTML = vs.map(v => `
    <article class="destaque-card">
      <h2>${esc(v.desc.substring(0,50))}${v.desc.length>50?'...':''}</h2>
      <div class="meta"><strong>Contratante:</strong> ${esc(v.nome)} · <strong>Local:</strong> ${esc(v.local)} · <strong>Valor:</strong> R$ ${v.valor}</div>
      <div class="meta">Duração: ${esc(v.dur)} · Tel: ${esc(v.tel)} · Tipo: ${esc(v.tipo||'-')}</div>
      <a href="detalhes-diaria.html?id=${v.id}" class="btn-small">Ver detalhes e contatar</a>
    </article>
  `).join('');
}
function filtrar(){
  const texto = document.getElementById('f-texto').value.toLowerCase();
  const tipo = document.getElementById('f-tipo').value;
  let vs = vagas.filter(v => {
    const okTexto = !texto || (v.desc+v.nome+v.local).toLowerCase().includes(texto);
    const okTipo = !tipo || (v.tipo===tipo || (texto && v.desc.toLowerCase().includes(tipo)));
    return okTexto && okTipo;
  });
  render(vs);
}
render(vagas);

// Menu dropdown
function buildNav(){
  const right = document.getElementById('nav-right');
  let logged = null;
  try{ logged = JSON.parse(localStorage.getItem('diarias_logged')) || null; }catch(e){}
  if(logged && logged.user){
    const tipo = (logged.tipo==='admin') ? 'Admin' : 'Usuário';
    right.innerHTML = `<button onclick="toggleDrop(event)" class="btn-small" aria-haspopup="true">${esc(logged.nome||logged.user)} ▼</button>
      <div id="drop-menu" class="dropdown" role="menu"><a href="perfil.html" role="menuitem">Perfil</a><a href="#" onclick="sair();return false;" role="menuitem">Sair</a></div>`;
  } else {
    right.innerHTML = `<a href="login.html" class="btn-small" style="text-decoration:none">Logar</a> <a href="cadastro.html" class="btn-ghost-small" style="text-decoration:none">Criar</a>`;
  }
}
function toggleDrop(e){ e.stopPropagation(); const m=document.getElementById('drop-menu'); if(m) m.classList.toggle('show'); }
document.addEventListener('click', () => { const m=document.getElementById('drop-menu'); if(m) m.classList.remove('show'); });
function sair(){ localStorage.setItem('diarias_logged','null'); location.reload(); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
buildNav();
</script>

<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Aviso de cookies"><div class="wrap" style="padding:0"><strong>Armazenamento local.</strong> Este site usa localStorage para guardar login, vagas e preferências. <button onclick="aceitarCookies()">Entendi</button></div></div>
<script>function aceitarCookies(){ localStorage.setItem('diarias_cookies','1'); document.getElementById('cookie-banner').classList.remove('show'); } if(!localStorage.getItem('diarias_cookies')) document.getElementById('cookie-banner').classList.add('show');</script>

</body>
</html>
