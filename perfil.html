<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Perfil — OF</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap');
  :root{--bg:#f6f5f0;--card:#fff;--accent:#d97706;--text:#2a2a2a;--sub:#6b6b6b;--line:#ebeae5;--dark:#2a2a2a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;font-size:16px;}
  a{color:var(--accent);text-decoration:none}
  .wrap{width:min(480px,95vw);margin-inline:auto;padding:1rem 1rem 3rem}
  header.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1rem}
  .header-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .logo-block{display:flex;align-items:center;gap:.6rem}
  .logo-sigla{width:36px;height:36px;border-radius:.5rem;background:var(--dark);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.1rem;flex-shrink:0}
  .logo-text{font-weight:700;font-size:.85rem;line-height:1.15;color:var(--text)}
  .nav-center{display:flex;gap:.85rem;font-weight:600;font-size:.85rem}
  .nav-right{position:relative}
  .btn-small{background:var(--accent);color:#fff;padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;border:none;cursor:pointer}
  .btn-ghost-small{background:transparent;border:1px solid #ddd;color:var(--text);padding:.35rem .65rem;border-radius:.4rem;font-weight:600;font-size:.78rem;cursor:pointer}
  .dropdown{position:absolute;right:0;top:2.4rem;background:#fff;border:1px solid var(--line);border-radius:.7rem;padding:.4rem;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.08);display:none}
  .dropdown.show{display:block}
  .dropdown a{display:block;padding:.55rem .6rem;border-radius:.4rem;font-size:.9rem;color:var(--text);font-weight:600}
  .dropdown a:hover{background:var(--bg)}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;margin:1.5rem 0 .5rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.03)}
  .card h2{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;margin-bottom:.25rem}
  .table{width:100%;border-collapse:collapse;font-size:.9rem}
  .table th,.table td{padding:.6rem .5rem;text-align:left;border-bottom:1px solid var(--line)}
  .table th{font-weight:600;color:var(--sub);font-size:.75rem;text-transform:uppercase}
  .tag{display:inline-block;background:var(--bg);padding:.2rem .5rem;border-radius:.3rem;font-weight:600;font-size:.75rem}
  footer{margin-top:2rem;padding:2rem 0;text-align:center;color:var(--sub);font-size:.85rem;border-top:1px solid var(--line)}
  .hidden{display:none!important}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-block" aria-label="OF"><div class="logo-sigla">OF</div><div class="logo-text">Ofício de Diárias</div></a>
    <nav class="nav-center"><a href="index.html">Home</a><a href="diarias.html">Diárias</a></nav>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main class="wrap">
  <h1>Perfil</h1>
  <div id="perfil-login" class="card">
    <h2>Você não está logado.</h2>
    <p class="sub"><a href="login.html">Faça login</a> ou <a href="cadastro.html">crie uma conta</a> para ver seu perfil.</p>
  </div>
  <div id="perfil-dados" class="hidden">
    <div class="card">
      <h2>Dados da conta</h2>
      <table class="table">
        <tr><th>Campo</th><th>Valor</th></tr>
        <tr><td>Usuário</td><td id="p-user"></td></tr>
        <tr><td>Nome</td><td id="p-nome"></td></tr>
        <tr><td>E-mail</td><td id="p-email"></td></tr>
        <tr><td>Telefone</td><td id="p-tel"></td></tr>
        <tr><td>Tipo</td><td id="p-tipo"></td></tr>
      </table>
    </div>
    <div class="card">
      <h2>Ações</h2>
      <p><a href="cadastrar-diaria.html">+ Cadastrar uma diária</a> · <a href="diarias.html">Ver diárias</a></p>
      <button onclick="sair()" class="btn-small" style="margin-top:.5rem;background:#2a2a2a">Sair</button>
    </div>
  </div>
</main>

<footer>
  <p><strong>OF.</strong> <a href="index.html">Home</a> · <a href="termos.html">Termos</a> · <a href="privacidade.html">Privacidade</a></p>
</footer>

<script>
let logged = JSON.parse(localStorage.getItem('diarias_logged') || 'null');
let users = JSON.parse(localStorage.getItem('diarias_users') || '[]');

function buildNav(){
  const right = document.getElementById('nav-right');
  if(logged && logged.user){
    right.innerHTML = `<button onclick="toggleDrop(event)" class="btn-small">${esc(logged.nome||logged.user)} ▼</button>
      <div id="drop-menu" class="dropdown"><a href="perfil.html">Perfil</a><a href="#" onclick="sair();return false;">Sair</a></div>`;
  } else {
    right.innerHTML = `<a href="login.html" class="btn-small">Logar</a> <a href="cadastro.html" class="btn-ghost-small">Criar</a>`;
  }
}
function toggleDrop(e){ e.stopPropagation(); const m=document.getElementById('drop-menu'); if(m) m.classList.toggle('show'); }
document.addEventListener('click', () => { const m=document.getElementById('drop-menu'); if(m) m.classList.remove('show'); });
function sair(){ localStorage.setItem('diarias_logged','null'); location.href='login.html'; }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
buildNav();

if(logged && logged.user){
  const u = users.find(x=>x.user===logged.user) || {user:logged.user, email:'—', tel:'—', tipo:logged.tipo||'—', name:logged.nome||logged.user};
  document.getElementById('perfil-login').classList.add('hidden');
  document.getElementById('perfil-dados').classList.remove('hidden');
  document.getElementById('p-user').textContent = esc(u.user);
  document.getElementById('p-nome').textContent = esc(u.name||u.user);
  document.getElementById('p-email').textContent = esc(u.email||'—');
  document.getElementById('p-tel').textContent = esc(u.tel||'—');
  document.getElementById('p-tipo').innerHTML = `<span class="tag">${esc(u.tipo||'-')}</span>`;
}
</script>

</body>
</html>
